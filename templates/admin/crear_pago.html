{% extends "admin/base_admin.html" %}

{% block title %}Crear Pago - Panel Administrativo{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <div class="col-12">
            <div class="card">
                <div class="card-header">
                    <h3 class="card-title">
                        <i class="fas fa-plus"></i>
                        Crear Nuevo Pago
                    </h3>
                    <div class="card-tools">
                        <a href="{{ url_for('pagos_admin.listar_pagos') }}" class="btn btn-secondary btn-sm">
                            <i class="fas fa-arrow-left"></i> Volver
                        </a>
                    </div>
                </div>
                
                <form method="POST" class="card-body">
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="usuario_id">Cliente *</label>
                                <select class="form-control" id="usuario_id" name="usuario_id" required>
                                    <option value="">Seleccionar cliente...</option>
                                    {% for cliente in clientes %}
                                    <option value="{{ cliente.id }}">{{ cliente.nombre }} ({{ cliente.email }})</option>
                                    {% endfor %}
                                </select>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="monto">Monto *</label>
                                <div class="input-group">
                                    <div class="input-group-prepend">
                                        <span class="input-group-text">$</span>
                                    </div>
                                    <input type="number" class="form-control" id="monto" name="monto" 
                                           step="0.01" min="0" required>
                                </div>
                            </div>
                        </div>
                    </div>
                    
                    <div class="row">
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="estado">Estado</label>
                                <select class="form-control" id="estado" name="estado">
                                    <option value="Pendiente">Pendiente</option>
                                    <option value="Completado">Completado</option>
                                    <option value="Cancelado">Cancelado</option>
                                    <option value="Reembolsado">Reembolsado</option>
                                </select>
                            </div>
                        </div>
                        
                        <div class="col-md-6">
                            <div class="form-group">
                                <label for="fecha">Fecha</label>
                                <input type="date" class="form-control" id="fecha" name="fecha" 
                                       value="{{ datetime.now().strftime('%Y-%m-%d') }}">
                            </div>
                        </div>
                    </div>
                    
                    <div class="form-group">
                        <label for="descripcion">Descripción</label>
                        <textarea class="form-control" id="descripcion" name="descripcion" 
                                  rows="3" placeholder="Descripción del pago..."></textarea>
                    </div>
                    
                    <div class="form-group">
                        <button type="submit" class="btn btn-primary">
                            <i class="fas fa-save"></i> Crear Pago
                        </button>
                        <a href="{{ url_for('pagos_admin.listar_pagos') }}" class="btn btn-secondary">
                            <i class="fas fa-times"></i> Cancelar
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.addEventListener('DOMContentLoaded', function() {
    // Validación del formulario
    const form = document.querySelector('form');
    form.addEventListener('submit', function(e) {
        const monto = document.getElementById('monto').value;
        const usuario_id = document.getElementById('usuario_id').value;
        
        if (!usuario_id) {
            e.preventDefault();
            alert('Por favor selecciona un cliente.');
            return;
        }
        
        if (!monto || parseFloat(monto) <= 0) {
            e.preventDefault();
            alert('Por favor ingresa un monto válido.');
            return;
        }
    });
});
</script>
{% endblock %}
